name: Docker Image CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Lowercase Repo Name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # ACA CORREGIMOS EL ERROR DEL CACHE
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Prod
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/optica-app:latest
            ghcr.io/${{ env.REPO_LC }}/optica-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/optica-worker:latest
            ghcr.io/${{ env.REPO_LC }}/optica-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes manifests
        run: |
          # Usamos un delimitador diferente en sed por las dudas con las slashes
          sed -i "s|image: ghcr.io/${{ env.REPO_LC }}/optica-app:.*|image: ghcr.io/${{ env.REPO_LC }}/optica-app:${{ github.sha }}|g" kube-manifests/app-deployment.yaml
          sed -i "s|image: ghcr.io/${{ env.REPO_LC }}/optica-app:.*|image: ghcr.io/${{ env.REPO_LC }}/optica-app:${{ github.sha }}|g" kube-manifests/worker-deployment.yaml

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update image tags to ${{ github.sha }} [skip ci]"
          branch: main
          file_pattern: 'kube-manifests/*.yaml'
