apiVersion: apps/v1
kind: Deployment
metadata:
  name: optica-app
  labels:
    io.kompose.service: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.network/optica-store-optica-network: "true"
        io.kompose.service: app
    spec:
      # --- PASO 1: ASEGURAR NODO ARGENTINA ---
      nodeSelector:
        area: optica-guzman

      containers:
        - name: optica-app
          image: ghcr.io/leafmtz/optica-app:latest # El CI cambiará ":latest" por el SHA
          imagePullPolicy: Always
          command: ["/var/www/html/docker/entrypoint.sh"]
          args:
            ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]

          # --- PASO 2: CARGAR VARIABLES DE GOLPE ---
          envFrom:
            - configMapRef:
                name: env # Esto carga todas las variables del ConfigMap de una

          ports:
            - containerPort: 80 # Puerto interno de Nginx/Apache en el pod

          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

      restartPolicy: Always
