                  name: env
            - name: ZIPNOVA_MOCK
              valueFrom:
                configMapKeyRef:
                  key: ZIPNOVA_MOCK
                  name: env
          image: ghcr.io/leafmtz/optica-app:latest
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:80
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          name: optica-app
          ports:
            - containerPort: 80
              hostPort: 8080
              protocol: TCP
      restartPolicy: Always
