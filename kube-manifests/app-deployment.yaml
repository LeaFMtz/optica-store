apiVersion: apps/v1
kind: Deployment
metadata:
  name: optica-app
  labels:
    io.kompose.service: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.network/optica-store-optica-network: "true"
        io.kompose.service: app
    spec:
      nodeSelector:
        area: optica-guzman
      containers:
        - name: optica-app
          image: ghcr.io/leafmtz/optica-app:f4dd0aedb797b0f4c8f97adefea37a584890ac5e
          imagePullPolicy: Always
          command: ["/var/www/html/docker/entrypoint.sh"]
          args:
            ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
          envFrom:
            - configMapRef:
                name: env
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "1100m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
      restartPolicy: Always
