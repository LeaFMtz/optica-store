apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -f docker-compose.override-production.yml --out ./kubernetes
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: cache
  name: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: cache
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -f docker-compose.override-production.yml --out ./kubernetes
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/optica-store-optica-network: "true"
        io.kompose.service: cache
    spec:
      containers:
        - image: redis:7.4-alpine
          name: optica-redis
      restartPolicy: Always
