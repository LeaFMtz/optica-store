[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; pm = static: workers arrancados al inicio, sin spawn overhead en runtime.
; max_children = 4: calibrado para 2 vCPU con CFS scheduler del kernel.
;   Benchmark: 8 workers → 29 req/s / 4 workers → 44 req/s (+52%).
;   Con más workers el CFS divide el quota de CPU en slices más chicos,
;   aumentando el wall time por request aunque el CPU total no cambie.
;   Sweet spot: la app es I/O bound (~70% wait en DB/Redis), lo que permite
;   múltiples workers por vCPU, pero el overhead de context switching
;   empieza a dominar pasados los 4 procesos en 2 vCPU con este workload.
pm = static
pm.max_children = 4

; Recicla workers después de N requests para prevenir memory leaks graduales.
; Con pm=static esto es la única forma de limpiar el heap acumulado.
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
