[PHP]
; Container limit: 250MB. Overhead fijo (OPcache 64MB + JIT 16MB + nginx/supervisor ~50MB
; + 4 workers baseline ~88MB) = ~218MB. Headroom por request: ~32MB.
; 64M cubre el pico observado (~20MB/request bajo carga) con margen.
memory_limit = 64M
post_max_size = 32M          
upload_max_filesize = 64M
max_execution_time = 60      
max_input_time = 60
expose_php = Off

[Opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=5000
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit_buffer_size=16M
opcache.jit=tracing
